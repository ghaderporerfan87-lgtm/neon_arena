
name: Build Neon Arena Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git zip unzip

      - name: Check source file
        run: |
          ls -la
          test -f neon_arena.cpp
          echo "Source file found"
