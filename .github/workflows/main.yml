
name: Build Neon Arena Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git zip unzip
          test -f neon_arena.cpp
          echo "Source file found"
